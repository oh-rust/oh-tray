[package]
name = "oh-tray"
version = "0.1.3"
edition = "2024"

[dependencies]
command-group = { version = "5.0.1",features = ["with-tokio"] }
tray-icon = "0.21.3"
image = "0.25.10"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
webbrowser = "1.2.6"
tao = "0.34.8"
embed-resource = "3.0.12"
anyhow = "1.0.104"
config = "0.15.27"
clap = { version = "4.6.7",features = ["derive"] }
tokio = { version = "1.54.1",features = ["full"] }
sys-locale = "0.3.2"
futures = "0.3.34"
libc = "0.2.191"
chrono = "0.4.45"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"] }


[profile.release]
lto = true          # Link Time Optimization
codegen-units = 1   # 减少生成单元，提高优化空间
opt-level = "z"     # "z" 优化体积，"s" 优化大小，默认 "3" 优化速度
